<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="rm-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Dark background shape -->
  <rect width="100" height="100" rx="22" fill="#080B11" stroke="#1F2937" stroke-width="2" />
  
  <!-- Subtle neural grid matrix dots -->
  <circle cx="20" cy="20" r="1.5" fill="#374151" opacity="0.6" />
  <circle cx="80" cy="20" r="1.5" fill="#374151" opacity="0.6" />
  <circle cx="20" cy="80" r="1.5" fill="#374151" opacity="0.6" />
  <circle cx="80" cy="80" r="1.5" fill="#374151" opacity="0.6" />
  
  <!-- Geometric RM Monogram -->
  <path d="M 26 72 V 28 H 40 C 48 28 52 32 52 38 C 52 44 48 48 40 48 H 26 M 38 48 L 53 72" 
        fill="none" 
        stroke="url(#rm-gradient)" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />
        
  <path d="M 54 72 V 38 L 67 56 L 80 38 V 72" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Active AI Node Indicator -->
  <circle cx="80" cy="28" r="3" fill="#00F0FF" />
</svg>
